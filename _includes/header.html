{% if site.prototype %}<div class="note" role="note">This is a student prototype – not a live service yet.</div>{% endif %}
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="{{ '/' | relative_url }}">Open <i>Door</i></a>
    <nav aria-label="Main">
      {% for item in site.nav %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
