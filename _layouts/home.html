---
layout: default
---
<section class="hero">
  <div class="eyebrow">{{ page.eyebrow }}</div>
  <h1>{{ page.headline }}</h1>
  <p>{{ page.intro }}</p>
</section>

<div class="section-head"><div><h2>{{ page.journey_title }}</h2><div class="muted">{{ page.journey_subtitle }}</div></div></div>
<div class="grid">
  {% for c in page.cards %}
  <article class="card">
    <div class="num">{{ c.label }}</div>
    <h3>{{ c.title }}</h3>
    <p>{{ c.text }}</p>
    <a class="btn secondary" href="{{ c.link | relative_url }}">{{ c.button }}</a>
  </article>
  {% endfor %}
</div>
