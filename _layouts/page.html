---
layout: default
---
<div class="wrap">
  <header class="page-head">
    {% if page.eyebrow %}<p class="kicker">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p class="lead">{{ page.intro }}</p>{% endif %}
  </header>
  <div class="page-content">
    {{ content }}
  </div>
</div>
