---
layout: page
---
<div class="prose">{{ content }}</div>
<form class="filters" id="opp-filters" onsubmit="return false" aria-label="Filter opportunities">
  <label>Type
    <select name="category">
      <option value="">All types</option>
      {% assign cats = site.opportunities | map: "category" | uniq | sort %}
      {% for c in cats %}<option>{{ c }}</option>{% endfor %}
    </select>
  </label>
  <label>Suitable for
    <select name="audience">
      <option value="">Everyone</option>
      <option>High school</option>
      <option>College & graduates</option>
      <option>Women in transition</option>
    </select>
  </label>
  <label class="check"><input type="checkbox" name="free"> Free only</label>
</form>
<p class="results-count" id="opp-count" aria-live="polite"></p>
<div class="entries">
  {% assign opps = site.opportunities | sort: "deadline", "last" %}
  {% for o in opps %}{% include opportunity.html item=o details=true %}{% endfor %}
</div>
<script src="{{ '/assets/js/filter.js' | relative_url }}"></script>
