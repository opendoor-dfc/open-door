---
layout: page
---
{% assign modules = site.modules | sort: "number" %}
<ol class="modules">
  {% for m in modules %}
  <li class="module">
    <h3>{{ m.number }}. {{ m.title }}</h3>
    <p><span class="label">You learn about</span>{{ m.focus }}</p>
    <p><span class="label">You create</span>{{ m.result }}</p>
  </li>
  {% endfor %}
</ol>
{% if content contains "<" %}<div class="prose" style="margin-top:32px">{{ content }}</div>{% endif %}
