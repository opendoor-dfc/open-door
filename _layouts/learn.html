---
layout: page
---
<div class="prose">{{ content }}</div>
{% assign modules = site.modules | sort: "number" %}
<ol class="module-list">
  {% for m in modules %}
  <li class="module">
    <h3>{{ m.title }}</h3>
    <p><span class="label">Focus</span>{{ m.focus }}</p>
    <p><span class="label">What you create</span>{{ m.result }}</p>
    {% if m.content != "" %}<div class="module-extra">{{ m.content | markdownify }}</div>{% endif %}
  </li>
  {% endfor %}
</ol>
