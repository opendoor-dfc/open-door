# Configuration for Pages CMS (https://pagescms.org) – the editor the team uses.
# It defines which forms and fields appear in the editor. Only change this file if you know what you're doing.

media:
  input: assets/images
  output: /assets/images

content:
  # ---------- Lists (collections) ----------
  - name: opportunities
    label: Opportunities
    type: collection
    path: _opportunities
    filename: "{primary}.md"
    view:
      fields: [title, type, subject, region]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: provider, label: Provider / organisation, type: string }
      - name: type
        label: Type
        type: select
        options:
          values: [Free certification, Internship, Fellowship, Scholarship]
      - name: subject
        label: Subject
        type: select
        options:
          values: [Business, Technology, Social Sciences, Arts]
      - name: region
        label: Region(s)
        type: select
        description: Choose Worldwide for online or international opportunities. They then appear under every region.
        options:
          multiple: true
          values: [Worldwide, Africa, Asia, Europe, Latin America, Middle East, North America, Oceania]
      - { name: mode, label: "Mode (Online, Hybrid, On-site)", type: string }
      - { name: cost, label: Cost or funding, type: string }
      - { name: deadline, label: Deadline, type: string, description: "e.g. 30 June 2027 or Open enrolment" }
      - { name: description, label: Short description, type: text }
      - { name: link, label: Official link, type: string, description: "Full address starting with https://" }
      - { name: example, label: Demo entry (not a real offer), type: boolean, default: false }

  - name: modules
    label: Foundation modules
    type: collection
    path: _modules
    filename: "{fields.number}-{primary}.md"
    view:
      fields: [number, title]
      sort: [number]
    fields:
      - { name: number, label: Module number, type: number, required: true }
      - { name: title, label: Title, type: string, required: true }
      - { name: summary, label: Short description, type: text }

  - name: resources
    label: Resources
    type: collection
    path: _resources
    filename: "{primary}.md"
    view:
      fields: [title, category, cost]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: example, label: Example entry (placeholder), type: boolean, default: false }
      - name: category
        label: Category
        type: select
        options:
          values: [Learning platforms, Course directories, "Templates & guides", Career tools]
      - { name: link, label: Link, type: string, description: "Full address starting with https://" }
      - { name: cost, label: Cost, type: string }
      - { name: summary, label: Short description, type: text }

  - name: events
    label: Events & Workshops
    type: collection
    path: _events
    filename: "{primary}.md"
    view:
      fields: [title, status, date]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: order, label: Position in list (1 = first), type: number }
      - { name: status, label: Status, type: string }
      - { name: target, label: For whom, type: text }
      - { name: focus, label: Focus, type: text }
      - { name: takeaway, label: Takeaway, type: text }
      - { name: date, label: Date, type: date, options: { format: yyyy-MM-dd } }
      - { name: location, label: Location, type: string }
      - { name: body, label: Description, type: rich-text }

  # ---------- Pages ----------
  - name: home
    label: "Page: Home"
    type: file
    path: index.md
    fields:
      - { name: layout, type: string, hidden: true, default: home }
      - { name: title, type: string, hidden: true, default: Home }
      - { name: eyebrow, label: Small label above headline, type: string }
      - { name: headline, label: Headline, type: string }
      - { name: intro, label: Introduction, type: text }
      - { name: button_text, label: Button text, type: string }
      - { name: button_link, label: "Button link (e.g. /path/)", type: string }
      - { name: journey_title, label: "Journey: title", type: string }
      - { name: journey_subtitle, label: "Journey: subtitle", type: string }
      - name: cards
        label: "Journey: cards"
        type: object
        list: true
        fields:
          - { name: label, label: "Label (e.g. 01 / LEARN)", type: string }
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: button, label: Button text, type: string }
          - { name: link, label: "Button link (e.g. /foundation/)", type: string }

  - name: foundation
    label: "Page: Foundation"
    type: file
    path: foundation.md
    fields:
      - { name: layout, type: string, hidden: true, default: foundation }
      - { name: title, label: Title, type: string }
      - { name: eyebrow, label: Small label above title, type: string }
      - { name: intro, label: Introduction, type: text }
      - { name: notice, label: Highlighted note, type: text }
      - { name: pill, label: Badge text, type: string }
      - { name: certificate_note, label: Certificate note, type: text }

  - name: path
    label: "Page: Find Your Path (quiz)"
    type: file
    path: path.md
    fields:
      - { name: layout, type: string, hidden: true, default: path }
      - { name: title, label: Title, type: string }
      - { name: eyebrow, label: Small label above title, type: string }
      - { name: intro, label: Introduction, type: text }
      - { name: notice, label: Highlighted note, type: text }
      - { name: fields, label: "Result fields (answer 1 → field 1, answer 2 → field 2 …)", type: string, list: true }
      - name: questions
        label: Questions
        type: object
        list: true
        fields:
          - { name: question, label: Question, type: string }
          - { name: answers, label: "Answers (same order as the result fields)", type: string, list: true }

  - name: opportunities-page
    label: "Page: Opportunities"
    type: file
    path: opportunities.md
    fields:
      - { name: layout, type: string, hidden: true, default: opportunities }
      - { name: title, label: Title, type: string }
      - { name: eyebrow, label: Small label above title, type: string }
      - { name: intro, label: Introduction, type: text }
      - { name: demo_notice, label: Highlighted note, type: text }
      - { name: types, label: Type filter options, type: string, list: true }
      - { name: subjects, label: Subject filter options, type: string, list: true }
      - { name: regions, label: Region filter options, type: string, list: true }

  - name: passport
    label: "Page: Passport"
    type: file
    path: passport.md
    fields:
      - { name: layout, type: string, hidden: true, default: passport }
      - { name: title, label: Title, type: string }
      - { name: eyebrow, label: Small label above title, type: string }
      - { name: intro, label: Introduction, type: text }
      - { name: stamp_notice, label: Highlighted note, type: text }

  - name: culture
    label: "Page: Culture Exchange"
    type: file
    path: culture.md
    fields:
      - { name: layout, type: string, hidden: true, default: cards }
      - { name: title, label: Title, type: string }
      - { name: eyebrow, label: Small label above title, type: string }
      - { name: intro, label: Introduction, type: text }
      - name: cards
        label: Cards
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: tag, label: Badge, type: string }
      - { name: bottom_notice, label: Note at the bottom, type: text }

  - name: dashboard
    label: "Page: My dashboard"
    type: file
    path: dashboard.md
    fields:
      - { name: layout, type: string, hidden: true, default: dashboard }
      - { name: title, type: string, hidden: true, default: My dashboard }
      - { name: eyebrow, label: Small label above greeting, type: string }
      - { name: greeting, label: Greeting, type: string }
      - { name: intro, label: Introduction, type: text }
      - name: cards
        label: "Next step: cards"
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: button, label: Button text, type: string }
          - { name: link, label: Button link, type: string }

  - name: resources-page
    label: "Page: Resources"
    type: file
    path: resources.md
    fields: &pagefields
      - { name: layout, type: string, hidden: true }
      - { name: title, label: Page title, type: string }
      - { name: eyebrow, label: Small label above title, type: string }
      - { name: intro, label: Introduction, type: text }
      - { name: body, label: Main text, type: rich-text }

  - name: events-page
    label: "Page: Events"
    type: file
    path: events.md
    fields: *pagefields

  - name: about
    label: "Page: About"
    type: file
    path: about.md
    fields: *pagefields
